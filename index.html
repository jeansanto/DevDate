<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convite 💌 - DevDate</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <img src="assets/imagens/anjo1.png" alt="Anjo" class="anjo-icon" />
        
        <h1>SEM PRESSÃO <br /><span class="highlight">MAS DIZ SIM</span></h1>
