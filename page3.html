<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agendar 📅 - DevDate</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <img src="assets/imagens/anjo3.png" alt="Anjo" class="anjo-icon" />
        
        <h1>BORA FECHAR <br /><span class="highlight">AMIGA</span></h1>

        <p class="sub-question">Então... quando você está livre?</p>

        <div class="date-inputs">
            <div class="input-group">
                <label>📆 Escolha um dia</label>
                <input type="date" id="datePicker" value="2026-06-26" />
            </div>

            <div class="input-group">
                <label>⏰ Que horas?</label>
                <input type="time" id="timePicker" value="19:30" />
                <span class="hint">19:30 - horário de risco certificado</span>
            </div>
        </div>

        <button class="btn btn-next" id="nextBtn3">
            só próximo →
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
